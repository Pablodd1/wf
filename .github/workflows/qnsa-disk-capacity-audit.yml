# Branch-only registration shim: this path is already registered on the default
# branch, while this dedicated definition runs only when this audit ref is
# selected manually.
name: QNSA Raw-First Rolex Patek Canonical Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_QNSA_RAW_FIRST_ROLEX_PATEK_AUDIT
        required: true
        type: string
      resume_run_id:
        description: Optional prior V2 run ID whose sanitized checkpoint should be resumed
        required: false
        type: string
      validate_artifact_run_id:
        description: Optional completed V2 run ID to validate without querying QNSA
        required: false
        type: string
      sample_high_cardinality:
        description: Also run ten bounded read-only source samples after artifact validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: qnsa-raw-first-rolex-patek-canonical-audit
  cancel-in-progress: false

jobs:
  canonical-read-only-audit:
    if: ${{ inputs.validate_artifact_run_id == '' }}
    name: Canonical QNSA SELECT-only audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: Production
    env:
      CANONICAL_PROJECT_REF: qnsafosakvonzgfcsphh
      RAW_FIRST_SHARDS: 16
      RAW_FIRST_PAGE_SIZE: 2000
      RAW_FIRST_PREFLIGHT_PAGE_SIZE: 100
      RAW_FIRST_OUTPUT: audit-output/raw-first-rolex-patek-run-${{ github.run_id }}
      RAW_FIRST_RESUME_DIR: audit-resume-input
      RAW_FIRST_PREFLIGHT_OUTPUT: audit-output/raw-first-rolex-patek-preflight-${{ github.run_id }}.json
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate dispatch and canonical target
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_QNSA_RAW_FIRST_ROLEX_PATEK_AUDIT"
          test "$CANONICAL_PROJECT_REF" = "qnsafosakvonzgfcsphh"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Check out audit candidate only
        uses: actions/checkout@v4
        with:
          ref: codex/raw-first-rolex-patek-audit
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate every statement as SELECT-only
        run: node tools/audit/raw-first-rolex-patek-audit.cjs --validate-only

      - name: Verify canonical Management API target before audit queries
        shell: bash
        run: |
          set -euo pipefail
          payload='{"query":"SELECT '\''qnsafosakvonzgfcsphh'\''::text AS project_ref;","read_only":true}'
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/qnsafosakvonzgfcsphh/database/query")"
          node -e "const rows=JSON.parse(process.argv[1]);if(rows?.[0]?.project_ref!=='qnsafosakvonzgfcsphh')process.exit(1)" "$response"

      - name: Preflight bounded current and Trading Floor pages
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit/raw-first-rolex-patek-audit.cjs --preflight > "$RAW_FIRST_PREFLIGHT_OUTPUT"
          node -e "const p=require('./' + process.env.RAW_FIRST_PREFLIGHT_OUTPUT);if(p.decision!=='PREFLIGHT_OK'||p.page_size>500)process.exit(1)"

      - name: Download sanitized resume checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Pablodd1/wf
          run-id: ${{ inputs.resume_run_id }}
          pattern: qnsa-raw-first-rolex-patek-${{ inputs.resume_run_id }}-*
          merge-multiple: true
          path: ${{ env.RAW_FIRST_RESUME_DIR }}

      - name: Execute or resume canonical bounded census
        id: audit
        shell: bash
        run: |
          set +e
          node tools/audit/raw-first-rolex-patek-audit.cjs
          audit_exit=$?
          set -e
          if [[ ! -f "$RAW_FIRST_OUTPUT/summary.json" ]]; then
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve(process.env.RAW_FIRST_OUTPUT);
          const checkpointPath = path.join(root, 'checkpoint.json');
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          checkpoint.status = 'INCOMPLETE';
          checkpoint.decision = 'AUDIT_INCOMPLETE_TECHNICAL';
          checkpoint.failure = { message: 'Audit process terminated before final summary; sanitized checkpoint preserved' };
          fs.writeFileSync(checkpointPath, `${JSON.stringify(checkpoint, null, 2)}\n`);
          fs.writeFileSync(path.join(root, 'summary.json'), `${JSON.stringify({
            contract: checkpoint.contract,
            decision: checkpoint.decision,
            generated_at: new Date().toISOString(),
            canonical_project_ref: checkpoint.canonical_project_ref,
            read_only: true,
            production_writes: 0,
            raw_mutations: 0,
            phase7b_rerun: false,
            error: checkpoint.failure.message,
            completed_pages: checkpoint.completed_pages,
          }, null, 2)}\n`);
          NODE
          fi
          decision="$(node -e "const fs=require('node:fs'); const path=require('node:path'); process.stdout.write(JSON.parse(fs.readFileSync(path.resolve(process.env.RAW_FIRST_OUTPUT, 'summary.json'),'utf8')).decision)")"
          case "$decision" in
            RAW_FIRST_READY|NOT_READY_RAW_SOURCE_GAPS|AUDIT_INCOMPLETE_QUERY_TIMEOUT|AUDIT_INCOMPLETE_TECHNICAL) ;;
            *) exit 1 ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"

      - name: Verify sanitized evidence contract
        if: ${{ always() && steps.audit.outputs.decision != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.RAW_FIRST_OUTPUT;
          const summary = JSON.parse(fs.readFileSync(path.join(root, 'summary.json'), 'utf8'));
          if (summary.canonical_project_ref !== 'qnsafosakvonzgfcsphh') throw new Error('wrong project');
          for (const key of ['production_writes', 'raw_mutations', 'endpoint_switches', 'ui_changes', 'catalog_changes']) {
            if (summary[key] !== 0) throw new Error(`${key} must be zero`);
          }
          if (summary.phase7b_rerun !== false || summary.read_only !== true) throw new Error('read-only contract failed');
          for (const name of ['summary.json', 'checkpoint.json']) {
            if (!fs.existsSync(path.join(root, name))) throw new Error(`missing ${name}`);
          }
          if (!summary.decision.startsWith('AUDIT_INCOMPLETE_')) {
            for (const name of ['manifest-sha256.json', 'sanitized-exact-deltas.json.gz']) {
              if (!fs.existsSync(path.join(root, name))) throw new Error(`missing ${name}`);
            }
          }
          NODE

      - name: Upload sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-raw-first-rolex-patek-${{ github.run_id }}-${{ steps.audit.outputs.decision || 'AUDIT_INCOMPLETE_TECHNICAL' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.RAW_FIRST_PREFLIGHT_OUTPUT }}
            ${{ env.RAW_FIRST_OUTPUT }}/summary.json
            ${{ env.RAW_FIRST_OUTPUT }}/checkpoint.json
            ${{ env.RAW_FIRST_OUTPUT }}/manifest-sha256.json
            ${{ env.RAW_FIRST_OUTPUT }}/sanitized-exact-deltas.json.gz
            ${{ env.RAW_FIRST_OUTPUT }}/resume-pages/**/*.json.gz

      - name: Preserve technical outcome after artifact upload
        if: ${{ always() && startsWith(steps.audit.outputs.decision, 'AUDIT_INCOMPLETE_') }}
        shell: bash
        run: exit 1

  validate-existing-child-counts:
    if: ${{ inputs.validate_artifact_run_id != '' }}
    name: Validate existing sanitized child counts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ inputs.sample_high_cardinality && secrets.SUPABASE_ACCESS_TOKEN || '' }}
    steps:
      - name: Validate artifact-only dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "VALIDATE_QNSA_RAW_FIRST_CHILD_COUNTS"
          [[ "${{ inputs.validate_artifact_run_id }}" =~ ^[0-9]+$ ]]

      - name: Check out validation candidate only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download completed sanitized artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Pablodd1/wf
          run-id: ${{ inputs.validate_artifact_run_id }}
          pattern: qnsa-raw-first-rolex-patek-${{ inputs.validate_artifact_run_id }}-*
          merge-multiple: true
          path: audit-resume-input

      - name: Validate identities, paging, and parent cardinality
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="$(find audit-resume-input -type f -name checkpoint.json -print -quit)"
          test -n "$checkpoint"
          artifact_root="$(dirname "$checkpoint")"
          mkdir -p audit-output/raw-first-child-validation
          node tools/audit/validate-raw-first-child-counts.cjs \
            "$artifact_root" \
            audit-output/raw-first-child-validation/report.json

          if [[ "${{ inputs.sample_high_cardinality }}" = "true" ]]; then
            test -n "$SUPABASE_ACCESS_TOKEN"
            node tools/audit/sample-raw-first-high-cardinality.cjs \
              "$artifact_root" \
              audit-output/raw-first-child-validation/report.json \
              audit-output/raw-first-child-validation/high-cardinality-sample.json
          fi

      - name: Upload compact child-count validation
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-raw-first-child-validation-${{ inputs.validate_artifact_run_id }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: audit-output/raw-first-child-validation/*.json
