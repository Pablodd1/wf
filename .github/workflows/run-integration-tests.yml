name: Run Integration Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: postgresql://${{ secrets.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ secrets.SUPABASE_DB_HOST }}:${{ secrets.SUPABASE_DB_PORT }}/postgres
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install psycopg2-binary
        
      - name: Run Python Integration Tests
        run: |
          python -m unittest discover tests
