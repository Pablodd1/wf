name: QNSA resumable full two-brand price correction

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_TWO_BRAND_PRICE_CORRECTION
        required: true
        type: string
      normalization_run_key:
        description: Existing completed normalization run
        required: true
        default: mariadb-normalized-20260811-codex-v1
        type: string
      correction_run_key:
        description: Stable resumable price correction key
        required: true
        default: rolex-patek-usd-fx-20260812-v1
        type: string
      database_limit_gib:
        description: Confirmed database volume limit in GiB
        required: true
        type: string
      minimum_headroom_gib:
        description: Required free headroom in GiB
        required: true
        default: '2'
        type: string
      max_batches:
        description: Bounded batches for this dispatch (1-500, 100 rows each)
        required: true
        default: '20'
        type: string

concurrency:
  group: qnsa-two-brand-price-correction
  cancel-in-progress: false

jobs:
  correct:
    if: ${{ inputs.confirmation == 'RUN_TWO_BRAND_PRICE_CORRECTION' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qnsafosakvonzgfcsphh
      EXPECTED_PROJECT_REF: qnsafosakvonzgfcsphh
      NORMALIZED_RUN_KEY: ${{ inputs.normalization_run_key }}
      CORRECTION_RUN_KEY: ${{ inputs.correction_run_key }}
      CORRECTION_POLICY_VERSION: usd-default-dated-fx-v1
      DATABASE_LIMIT_GIB: ${{ inputs.database_limit_gib }}
      MINIMUM_HEADROOM_GIB: ${{ inputs.minimum_headroom_gib }}
      MAX_PENDING_JOBS: '1000'
      MAX_FAILED_JOBS: '0'
      CORRECTION_PAGE_SIZE: '100'
      CORRECTION_MAX_BATCHES: ${{ inputs.max_batches }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts

      - name: Validate pinned target and bounded execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          if ($env:SUPABASE_PROJECT_REF -ne $env:EXPECTED_PROJECT_REF) { throw 'Unexpected Supabase project.' }
          foreach ($value in @($env:NORMALIZED_RUN_KEY, $env:CORRECTION_RUN_KEY, $env:CORRECTION_POLICY_VERSION)) {
            if ($value -notmatch '^[A-Za-z0-9._:-]{1,100}$') { throw 'Invalid run or policy key.' }
          }
          if ([int]$env:CORRECTION_MAX_BATCHES -lt 1 -or [int]$env:CORRECTION_MAX_BATCHES -gt 500) {
            throw 'max_batches must be between 1 and 500.'
          }

      - name: Install private cursor contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = Get-Content -Raw -LiteralPath 'supabase/migrations/20260812123000_two_brand_missing_price_cursor.sql'
          if ($sql -match '(?i)INSERT\s+INTO\s+(?:public\.)?watch_records') { throw 'Migration attempts a legacy publication write.' }
          $body = @{ query = [string]$sql; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: Run bounded resumable correction
        run: node tools/mariadb-live/run-two-brand-price-correction.cjs

      - name: Collect sanitized durable reconciliation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $escaped = $env:CORRECTION_RUN_KEY.Replace("'", "''")
          $sql = @"
          SELECT jsonb_build_object(
            'correction_run_key', correction_run_key,
            'normalization_run_key', normalization_run_key,
            'policy_version', policy_version,
            'census_rows', census_rows,
            'scanned_rows', scanned_rows,
            'corrected_rows', corrected_rows,
            'skipped_rows', skipped_rows,
            'batch_sequence', batch_sequence,
            'status', status,
            'accounting_reconciled', scanned_rows = corrected_rows + skipped_rows,
            'complete_reconciled', status <> 'COMPLETE' OR scanned_rows = census_rows,
            'staging_rows_created', 0
          ) AS reconciliation
          FROM staging.mariadb_price_policy_correction_runs
          WHERE correction_run_key = '$escaped';
          "@
          $body = @{ query = [string]$sql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          if ($result[0].reconciliation) {
            $result[0].reconciliation | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 full-correction-reconciliation.json
          }

      - name: Upload sanitized counts and cursor status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-two-brand-price-correction-${{ github.run_id }}
          path: full-correction-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
