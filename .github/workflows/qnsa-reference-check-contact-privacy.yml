name: QNSA Reference Check contact privacy

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: audit
        type: choice
        options: [audit, apply]
      confirmation:
        description: Type AUDIT_REFERENCE_CONTACT or APPLY_REFERENCE_CONTACT
        required: true
        type: string

concurrency:
  group: qnsa-reference-check-contact-privacy
  cancel-in-progress: false

jobs:
  privacy:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qnsafosakvonzgfcsphh
      MIGRATION_FILE: supabase/migrations/20260816143000_qnsa_dealer_phone_search_consent.sql
    steps:
      - uses: actions/checkout@v4

      - name: Compile forward migration and inspect current contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = if ('${{ inputs.mode }}' -eq 'apply') { 'APPLY_REFERENCE_CONTACT' } else { 'AUDIT_REFERENCE_CONTACT' }
          if ('${{ inputs.confirmation }}' -cne $expected) { throw "Confirmation must be $expected" }
          if ($env:PROJECT_REF -ne 'qnsafosakvonzgfcsphh' -or -not $env:SUPABASE_ACCESS_TOKEN) { throw 'Pinned QNSA credentials unavailable.' }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $migration = [string](Get-Content -Raw -LiteralPath $env:MIGRATION_FILE)
          $compile = @{ query = "BEGIN;`n$migration`nROLLBACK;"; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType application/json -Body $compile | Out-Null

          $sql = @"
          SET statement_timeout='10s';
          SELECT jsonb_build_object(
            'verified_dealers', (SELECT count(*) FROM public.dealers WHERE status='VERIFIED'),
            'function_exists', to_regprocedure('public.qnsa_dealer_directory_page(text,integer,integer)') IS NOT NULL,
            'anon_execute', has_function_privilege('anon','public.qnsa_dealer_directory_page(text,integer,integer)','EXECUTE'),
            'authenticated_execute', has_function_privilege('authenticated','public.qnsa_dealer_directory_page(text,integer,integer)','EXECUTE')
          ) evidence;
          "@
          $body = @{ query = $sql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType application/json -Body $body
          $evidence = $result[0].evidence
          $evidence | ConvertTo-Json -Depth 4 | Set-Content qnsa-reference-contact-audit.json
          if ([long]$evidence.verified_dealers -lt 1 -or -not [bool]$evidence.function_exists -or [bool]$evidence.anon_execute -or [bool]$evidence.authenticated_execute) { throw 'Reference Check contract audit failed.' }

      - name: Apply only the forward privacy function
        if: ${{ inputs.mode == 'apply' }}
        shell: powershell
        run: |
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $migration = [string](Get-Content -Raw -LiteralPath $env:MIGRATION_FILE)
          $body = @{ query = $migration; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType application/json -Body $body | Out-Null

      - name: Verify consent gate and canonical directory state
        if: ${{ inputs.mode == 'apply' }}
        shell: powershell
        run: |
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = @"
          SET statement_timeout='15s';
          SELECT jsonb_build_object(
            'contract_safe', position('d.contact_consent = true' in pg_get_functiondef(to_regprocedure('public.qnsa_dealer_directory_page(text,integer,integer)'))) > 0,
            'verified_dealers', (SELECT count(*) FROM public.dealers WHERE status='VERIFIED'),
            'anon_execute', has_function_privilege('anon','public.qnsa_dealer_directory_page(text,integer,integer)','EXECUTE'),
            'authenticated_execute', has_function_privilege('authenticated','public.qnsa_dealer_directory_page(text,integer,integer)','EXECUTE')
          ) evidence;
          "@
          $body = @{ query = $sql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType application/json -Body $body
          $evidence = $result[0].evidence
          $evidence | ConvertTo-Json -Depth 4 | Set-Content qnsa-reference-contact-smoke.json
          if (-not [bool]$evidence.contract_safe -or [long]$evidence.verified_dealers -lt 1 -or [bool]$evidence.anon_execute -or [bool]$evidence.authenticated_execute) { throw 'Reference Check privacy smoke failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: qnsa-reference-contact-${{ inputs.mode }}-${{ github.run_id }}
          path: qnsa-reference-contact-*.json
          if-no-files-found: error
