name: QNSA later-brand bounded feed hotfix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_QNSA_LATER_BRAND_FEED
        required: true

permissions:
  contents: read

jobs:
  apply-and-smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      PROJECT_REF: qnsafosakvonzgfcsphh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate authorization
        shell: pwsh
        run: |
          if ('${{ inputs.confirmation }}' -cne 'APPLY_QNSA_LATER_BRAND_FEED') { throw 'Invalid confirmation' }
          if ($env:PROJECT_REF -ne 'qnsafosakvonzgfcsphh') { throw 'Wrong Supabase target' }
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'Missing Supabase access token' }
      - name: Apply forward function
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = @(
            Get-Content -Raw supabase/migrations/20260814100000_qnsa_later_brand_bounded_feed.sql
            Get-Content -Raw supabase/migrations/20260814110000_qnsa_later_brand_reference_gate.sql
            Get-Content -Raw supabase/migrations/20260814111500_qnsa_later_brand_reference_gate_bound.sql
            Get-Content -Raw supabase/migrations/20260814112000_qnsa_later_brand_reference_key_gate.sql
            Get-Content -Raw supabase/migrations/20260814112500_qnsa_later_brand_reference_window.sql
            Get-Content -Raw supabase/migrations/20260814114000_qnsa_later_brand_stable_pagination.sql
            Get-Content -Raw supabase/migrations/20260814114500_qnsa_later_brand_candidate_cursor.sql
          Get-Content -Raw supabase/migrations/20260814115000_qnsa_later_brand_bounded_candidate_stride.sql
          Get-Content -Raw supabase/migrations/20260814123000_qnsa_rm_low_latency_stride.sql
          Get-Content -Raw supabase/migrations/20260814124000_qnsa_rm_reliable_stride.sql
          ) -join "`n"
          if ($sql -match '(?i)(CREATE\s+INDEX|INSERT\s+INTO\s+staging\.listings|UPDATE\s+staging\.listings|DELETE\s+FROM\s+staging\.listings)') {
            throw 'Unexpected storage-heavy or destructive statement'
          }
          $body = @{ query = $sql; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" `
            -Headers $headers -ContentType application/json -Body $body | Out-Null
      - name: Bounded smoke test
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          # The management API's read-only role cannot EXECUTE service-role-only
          # functions. This is still a SELECT-only smoke query, but it must use
          # the owner execution context to exercise the exact customer RPC.
          function Invoke-CandidatePage([string]$brand, [long]$offset) {
            $safeBrand = $brand.Replace("'", "''")
            $sql = "SET LOCAL statement_timeout='20s'; SELECT public.qnsa_later_brand_candidate_stride_page('$safeBrand',$offset,50,NULL) AS page;"
            $body = @{ query = $sql; read_only = $false } | ConvertTo-Json -Depth 3
            $started = [System.Diagnostics.Stopwatch]::StartNew()
            $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" `
              -Headers $headers -ContentType application/json -Body $body
            $started.Stop()
            return @{ page = $result[-1].page; latency_ms = $started.ElapsedMilliseconds }
          }
          $evidence = @()
          foreach ($brand in @('Richard Mille', 'Cartier')) {
            # Each page gets its own 20-second statement budget; one slow brand
            # cannot consume the other brand/page smoke budget.
            $firstResult = Invoke-CandidatePage $brand 0
            $firstPage = $firstResult.page
            if (-not $firstPage -or -not $firstPage.rows) { throw "Missing first-page envelope for $brand" }
            $secondResult = Invoke-CandidatePage $brand ([long]$firstPage.next_offset)
            $secondPage = $secondResult.page
            if (-not $secondPage -or -not $secondPage.rows) { throw "Missing second-page envelope for $brand" }
            $firstIds = @($firstPage.rows | ForEach-Object { [string]$_.id })
            $secondIds = @($secondPage.rows | ForEach-Object { [string]$_.id })
            $invalidRows = @($firstPage.rows | Where-Object {
              [string]$_.normalized_reference -in @('BRAND-NEW', 'BREATHABLE', 'RM001EITHER')
            }).Count
            $duplicates = @($firstIds | Where-Object { $_ -in $secondIds }).Count
            $evidence += [pscustomobject]@{
              brand = $brand
              rows = @($firstPage.rows).Count
              scanned_count = [long]$firstPage.scanned_count
              next_offset = [long]$firstPage.next_offset
              has_more = [bool]$firstPage.has_more
              first_latency_ms = [long]$firstResult.latency_ms
              second_latency_ms = [long]$secondResult.latency_ms
              invalid_rows = $invalidRows
              cross_page_duplicate_ids = $duplicates
            }
          }
          $evidence | ConvertTo-Json -Depth 3
          if ($evidence.Count -ne 2) { throw 'Missing per-brand smoke evidence' }
          if (@($evidence | Where-Object { [long]$_.rows -lt 1 }).Count -gt 0) { throw 'Bounded feed returned no valid rows' }
          if (@($evidence | Where-Object { [long]$_.scanned_count -lt 1 -or [long]$_.scanned_count -gt 50 }).Count -gt 0) { throw 'Candidate stride is outside the bounded contract' }
          if (@($evidence | Where-Object { $_.brand -eq 'Richard Mille' -and [long]$_.scanned_count -gt 4 }).Count -gt 0) { throw 'Richard Mille exceeded the 4-candidate reliability stride' }
          if (@($evidence | Where-Object { [long]$_.next_offset -lt 1 }).Count -gt 0) { throw 'Candidate cursor did not advance' }
          if (@($evidence | Where-Object { [long]$_.invalid_rows -ne 0 }).Count -gt 0) { throw 'Parser-artifact reference escaped strict feed' }
          if (@($evidence | Where-Object { [long]$_.cross_page_duplicate_ids -ne 0 }).Count -gt 0) { throw 'Candidate cursor repeated IDs across pages' }
      - name: Customer endpoint latency smoke
        shell: pwsh
        run: |
          $evidence = @()
          foreach ($brand in @('Richard Mille', 'Cartier')) {
            $encodedBrand = [uri]::EscapeDataString($brand)
            $audit = [uri]::EscapeDataString("later-brand-$brand-$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())")
            $url = "https://watchfacts-poc.vercel.app/api/reviewed-market-inventory?brand=$encodedBrand&item=watches&pagination=cursor&pageSize=12&audit=$audit"
            $timings = @()
            $lastBody = $null
            foreach ($attempt in 1..2) {
              $started = [System.Diagnostics.Stopwatch]::StartNew()
              $response = Invoke-WebRequest -Method Get -Uri $url -Headers @{ 'Cache-Control' = 'no-cache' }
              $started.Stop()
              if ([int]$response.StatusCode -ne 200) { throw "Customer endpoint returned $($response.StatusCode) for $brand" }
              $lastBody = $response.Content | ConvertFrom-Json
              if (@($lastBody.records).Count -lt 1) { throw "Customer endpoint returned no records for $brand" }
              $timings += [long]$started.ElapsedMilliseconds
            }
            $evidence += [pscustomobject]@{
              brand = $brand
              first_latency_ms = $timings[0]
              second_latency_ms = $timings[1]
              rows = @($lastBody.records).Count
            }
          }
          $evidence | ConvertTo-Json -Depth 3
          if (@($evidence | Where-Object { [long]$_.first_latency_ms -gt 18000 -or [long]$_.second_latency_ms -gt 8000 }).Count -gt 0) {
            throw 'Customer endpoint exceeds the hosted cold/warm latency budget'
          }
