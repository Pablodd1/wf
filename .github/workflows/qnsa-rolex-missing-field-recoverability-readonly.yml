name: QNSA Rolex missing-field recoverability read-only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type READ_ONLY_ROLEX_MISSING_FIELD_RECOVERABILITY
        required: true
        type: string

concurrency:
  group: qnsa-rolex-missing-field-recoverability-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
      MYSQL_DB: thecollective_inventory
      AUDIT_OUTPUT_DIR: audit-output/rolex-missing-field-recoverability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Validate read-only authorization
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CONFIRMATION -cne 'READ_ONLY_ROLEX_MISSING_FIELD_RECOVERABILITY') { throw 'Exact read-only confirmation required.' }
          if (-not $env:SUPABASE_ACCESS_TOKEN -or -not $env:MYSQL_HOST) { throw 'Private read-only credentials unavailable.' }
          node tools/audit/rolex-missing-field-recoverability-readonly.cjs --validate-only
      - name: Run private read-only recoverability census
        run: node tools/audit/rolex-missing-field-recoverability-readonly.cjs
      - name: Upload privacy-safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-rolex-missing-field-recoverability-${{ github.run_id }}
          path: audit-output/rolex-missing-field-recoverability/*
          if-no-files-found: error
          retention-days: 14
