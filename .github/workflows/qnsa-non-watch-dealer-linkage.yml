name: QNSA non-watch exact dealer linkage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only audit, capped 10-link canary, or full reconciliation
        required: true
        default: audit
        type: choice
        options: [audit, canary, full]
      confirmation:
        description: Type AUDIT_QNSA_NON_WATCH_LINKAGE, CANARY_QNSA_NON_WATCH_LINKAGE, or FULL_QNSA_NON_WATCH_LINKAGE
        required: true
        type: string
      install_contract:
        description: Install the reviewed forward-only RPC before canary/full
        required: true
        default: false
        type: boolean

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qnsafosakvonzgfcsphh
      NON_WATCH_LINKAGE_MODE: ${{ inputs.mode }}
      NON_WATCH_LINKAGE_PAGE_SIZE: '1000'
      NON_WATCH_LINKAGE_CANARY_LIMIT: '10'
      NON_WATCH_LINKAGE_MAX_PAGES: '5000'
      NON_WATCH_LINKAGE_DELAY_MS: ${{ inputs.mode == 'full' && '50' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate mode and confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          INSTALL_CONTRACT: ${{ inputs.install_contract }}
        run: |
          set -euo pipefail
          case "$NON_WATCH_LINKAGE_MODE" in
            audit) expected='AUDIT_QNSA_NON_WATCH_LINKAGE' ;;
            canary) expected='CANARY_QNSA_NON_WATCH_LINKAGE' ;;
            full) expected='FULL_QNSA_NON_WATCH_LINKAGE' ;;
            *) echo 'Invalid linkage mode.' >&2; exit 1 ;;
          esac
          test "$CONFIRMATION" = "$expected"
          test "$SUPABASE_PROJECT_REF" = 'qnsafosakvonzgfcsphh'
          if [ "$NON_WATCH_LINKAGE_MODE" = 'audit' ]; then
            test "$INSTALL_CONTRACT" = 'false'
          else
            test "$INSTALL_CONTRACT" = 'true'
          fi

      - name: Compile contract and run read-only audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          if ($env:NON_WATCH_LINKAGE_MODE -ne 'audit') {
            [string]$migration = Get-Content -Raw -LiteralPath 'supabase/migrations/20260815223000_qnsa_non_watch_exact_phone_linkage.sql'
            $compileSql = $migration -replace '(?im)^\s*(BEGIN|COMMIT);\s*$', ''
            $compileBody = @{ query = "BEGIN;`n$compileSql`nROLLBACK;"; read_only = $false } | ConvertTo-Json -Depth 3
            Invoke-RestMethod -Method Post `
              -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" `
              -Headers $headers -ContentType 'application/json' -Body $compileBody | Out-Null
          }
          $auditSql = @"
          SELECT jsonb_build_object(
            'raw_version_primary_key', to_regclass('public.raw_message_versions_pkey') IS NOT NULL,
            'raw_version_lineage_index', to_regclass('staging.idx_staging_mariadb_raw_version') IS NOT NULL,
            'enabled_run_key', (SELECT enabled_run_key FROM public.qnsa_market_feed_control
              WHERE singleton=true AND enabled=true),
            'enabled_categories', (SELECT enabled_categories FROM public.qnsa_market_feed_control
              WHERE singleton=true AND enabled=true),
            'released_singletons_by_category', (SELECT COALESCE(jsonb_object_agg(category, row_count), '{}'::jsonb)
              FROM (SELECT upper(l.category) category, count(*) row_count
                FROM staging.listings l JOIN public.qnsa_market_feed_control c
                  ON c.singleton=true AND c.enabled=true
                 AND l.normalization_run_key=c.enabled_run_key
                 AND upper(l.category)=ANY(c.enabled_categories)
                WHERE upper(l.category) IN ('HANDBAG','JEWELRY','ACCESSORY')
                  AND l.parent_id IS NULL AND COALESCE(l.is_bundle,false)=false
                  AND l.provenance_metadata->>'bundle_status'='SINGLE_CANDIDATE'
                GROUP BY upper(l.category)) counts),
            'existing_links_by_category', (SELECT COALESCE(jsonb_object_agg(category, row_count), '{}'::jsonb)
              FROM (SELECT upper(l.category) category, count(*) row_count
                FROM public.dealer_listing_links link JOIN staging.listings l ON l.id=link.listing_id
                WHERE link.link_status='APPLIED'
                  AND upper(l.category) IN ('HANDBAG','JEWELRY','ACCESSORY')
                GROUP BY upper(l.category)) counts),
            'duplicate_verified_phones', (SELECT count(*) FROM (
              SELECT public.normalize_seller_phone_identity(source_identity)
              FROM public.dealer_source_identities
              WHERE verification_status='VERIFIED'
                AND upper(identity_type) IN ('PHONE','WHATSAPP')
                AND public.normalize_seller_phone_identity(source_identity) IS NOT NULL
              GROUP BY 1 HAVING count(DISTINCT dealer_id)>1
            ) duplicates),
            'orphan_links', (SELECT count(*) FROM public.dealer_listing_links link
              LEFT JOIN staging.listings l ON l.id=link.listing_id WHERE l.id IS NULL)
          ) AS evidence;
          "@
          $auditBody = @{ query = $auditSql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post `
            -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" `
            -Headers $headers -ContentType 'application/json' -Body $auditBody
          $evidence = $result[0].evidence
          $evidence | ConvertTo-Json -Depth 8 | Set-Content qnsa-non-watch-linkage-audit.json
          if ($evidence.raw_version_primary_key -ne $true -or $evidence.raw_version_lineage_index -ne $true -or
              [long]$evidence.duplicate_verified_phones -ne 0 -or [long]$evidence.orphan_links -ne 0) {
            throw 'Non-watch dealer linkage prerequisites failed.'
          }

      - name: Install forward-only linkage contract
        if: ${{ inputs.install_contract && inputs.mode != 'audit' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SUPABASE_PROJECT_REF -ne 'qnsafosakvonzgfcsphh') { throw 'Unexpected Supabase project.' }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          [string]$sql = Get-Content -Raw -LiteralPath 'supabase/migrations/20260815223000_qnsa_non_watch_exact_phone_linkage.sql'
          $body = @{ query = $sql; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post `
            -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" `
            -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: Run capped canary or full reconciliation
        if: ${{ inputs.install_contract && inputs.mode != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/dealer-directory/run-non-watch-exact-linkage.cjs \
            | tee qnsa-non-watch-linkage-reconciliation.json

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-non-watch-linkage-${{ inputs.mode }}
          path: |
            qnsa-non-watch-linkage-audit.json
            qnsa-non-watch-linkage-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
