name: Inspect Supabase production migration ledger

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSPECT_PRODUCTION_MIGRATION_LEDGER to continue
        required: true
        type: string

concurrency:
  group: supabase-migration-ledger-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuc2Fmb3Nha3ZvbnpnZmNzcGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjI3NDEsImV4cCI6MjEwMTU5ODc0MX0.YUxMjnTHtgPsiWiWko3TS1A47Sjk33SuHC2TND0Rxmg"
      ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuc2Fmb3Nha3ZvbnpnZmNzcGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjI3NDEsImV4cCI6MjEwMTU5ODc0MX0.YUxMjnTHtgPsiWiWko3TS1A47Sjk33SuHC2TND0Rxmg"
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Resolve IPv4 pooler target and Database URL
        shell: bash
        run: |
          set -euo pipefail
          HOST="aws-1-us-west-2.pooler.supabase.com"
          USER="postgres.${SUPABASE_PROJECT_REF}"
          PORT="5432"
          echo "DATABASE_URL=postgresql://${USER}:${PGPASSWORD}@${HOST}:${PORT}/postgres" >> "$GITHUB_ENV"
          
      - name: Install dependencies
        run: pip install psycopg2-binary pymysql
        
      - name: Run Python Integration Tests
        run: |
          python -m unittest discover tests
