name: QNSA Vacheron Overseas read-only census

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_QNSA_VACHERON_OVERSEAS
        required: true
        type: string
      exact_five:
        description: Restrict the run to the frozen five-watch production canary
        required: true
        default: false
        type: boolean

concurrency:
  group: qnsa-vacheron-overseas-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_REF: qnsafosakvonzgfcsphh
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact authorization
        shell: pwsh
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_CONFIRMATION -cne 'AUDIT_QNSA_VACHERON_OVERSEAS') {
            throw 'Confirmation must exactly match AUDIT_QNSA_VACHERON_OVERSEAS.'
          }
          if ($env:SUPABASE_PROJECT_REF -cne 'qnsafosakvonzgfcsphh') {
            throw 'Workflow is pinned to canonical QNSA.'
          }

      - uses: actions/setup-node@v4
        if: inputs.exact_five == true
        with:
          node-version: 22

      - name: Install exact-canary runtime
        if: inputs.exact_five == true
        run: npm ci

      - name: Run exact five-watch source and public audit
        id: exact_source_public
        if: inputs.exact_five == true
        continue-on-error: true
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: https://qnsafosakvonzgfcsphh.supabase.co
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB: thecollective_inventory
          WATCHFACTS_ORIGIN: https://watchfacts-poc.vercel.app
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          if (-not $env:MYSQL_HOST -or -not $env:MYSQL_USER -or -not $env:MYSQL_PASS) {
            throw 'MariaDB read credentials are unavailable.'
          }
          New-Item -ItemType Directory -Force -Path 'audit-output/five-watch-production' | Out-Null
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $keys = Invoke-RestMethod -Method Get `
            -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/api-keys" -Headers $headers
          $service = @($keys | Where-Object {
            $_.api_key -and ($_.name -eq 'service_role' -or $_.type -eq 'secret')
          }) | Select-Object -First 1
          if (-not $service.api_key) { throw 'Current QNSA service key is unavailable.' }
          "::add-mask::$($service.api_key)"
          $env:SUPABASE_SERVICE_ROLE_KEY = [string]$service.api_key
          node tools/audit/five-watch-production-readonly.cjs `
            --output 'audit-output/five-watch-production/public-source.json'
          if ($LASTEXITCODE -ne 0) { throw 'Exact public/source audit failed.' }

      - name: Snapshot exact five staging and release rows
        if: inputs.exact_five == true
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = @'
          SET statement_timeout = '15s';
          SET lock_timeout = '3s';
          WITH targets(id, expected_brand, expected_reference, expected_source_record_id, ordinal) AS (
            VALUES
              ('d7ca9584-c8d0-43a5-8e19-7cf3fc4473e2'::uuid,'Zenith','95.9000.9004/78.M9000','mysql_auctions_f5aa2a73-53cf-47fd-b5c9-12d9912ceea6',1),
              ('0a6e7949-1717-4123-994c-17377f7e9ab8'::uuid,'Tudor','79830RB','mysql_auctions_8dda4207-e65a-415e-825a-684aeea99203',2),
              ('5f11c5b4-bd08-4976-9a87-af1a9921a8a3'::uuid,'Omega','310.60.42.50.01.001','mysql_auctions_1b50a1b1-a3c1-4747-bdc1-16de9060c729',3),
              ('ec507bd1-9cfc-4be2-aaa4-3f0dd477af80'::uuid,'Cartier','WSSA0039','mysql_auctions_149a44ef-e6b5-4e86-a1fd-1ae7717b0679',4),
              ('f125afdc-c21a-4450-a59b-01f3f667edb2'::uuid,'Vacheron Constantin','7900V/110A-B546','mysql_auctions_a562f952-4be0-4571-b27d-a7daa4ff354b',5)
          ), rows AS MATERIALIZED (
            SELECT t.id AS expected_id, t.expected_brand, t.expected_reference,
              t.expected_source_record_id, t.ordinal, l.*,
              rv.source_record_id AS rv_source_record_id,
              rv.source_hash AS rv_source_hash,
              rv.observed_at AS rv_observed_at,
              rv.created_at AS rv_created_at,
              rv.raw_message_source AS rv_raw_message_source,
              rv.raw_text AS rv_raw_text,
              rv.media AS rv_media
            FROM targets t
            LEFT JOIN staging.listings l ON l.id=t.id
            LEFT JOIN public.raw_message_versions rv ON rv.id=l.raw_message_version_id
          ), shaped AS (
            SELECT r.ordinal, jsonb_build_object(
              'expected_id',r.expected_id::text,
              'found',r.id IS NOT NULL,
              'expected_brand',r.expected_brand,
              'brand_original',r.brand_original,
              'brand_normalized',r.brand_normalized,
              'expected_reference',r.expected_reference,
              'reference_original',r.reference_original,
              'reference_normalized',r.reference_normalized,
              'expected_source_record_id',r.expected_source_record_id,
              'source_record_id',r.source_record_id,
              'source_record_matches',r.source_record_id IS NOT DISTINCT FROM r.expected_source_record_id,
              'normalization_run_key',r.normalization_run_key,
              'raw_message_version_id',r.raw_message_version_id,
              'source_hash',r.source_hash,
              'source_candidate_hash',r.source_candidate_hash,
              'raw_version_source_record_matches',r.rv_source_record_id IS NOT NULL
                AND r.rv_source_record_id=r.source_record_id,
              'raw_version_source_hash_matches',r.rv_source_hash IS NOT NULL
                AND r.rv_source_hash=r.source_hash,
              'raw_message_exact_match',r.rv_raw_text IS NOT NULL AND r.raw_message_text IS NOT NULL
                AND r.rv_raw_text=r.raw_message_text,
              'raw_message_length',length(COALESCE(r.raw_message_text,'')),
              'raw_message_sha256',encode(extensions.digest(convert_to(COALESCE(r.raw_message_text,''),'UTF8'),'sha256'),'hex'),
              'raw_version_length',length(COALESCE(r.rv_raw_text,'')),
              'raw_version_sha256',encode(extensions.digest(convert_to(COALESCE(r.rv_raw_text,''),'UTF8'),'sha256'),'hex'),
              'raw_message_source',r.rv_raw_message_source,
              'raw_media_count',jsonb_array_length(COALESCE(r.rv_media,'[]'::jsonb)),
              'raw_observed_at',r.rv_observed_at,
              'raw_version_created_at',r.rv_created_at,
              'listing_created_at',r.created_at,
              'model_original',r.model_original,
              'model_normalized',r.model_normalized,
              'price_original',r.price_original,
              'currency_original',r.currency_original,
              'price_normalized',r.price_normalized,
              'currency_normalized',r.currency_normalized,
              'price_usd',r.price_usd,
              'conversion_rate',r.conversion_rate,
              'conversion_source',r.conversion_source,
              'conversion_timestamp',r.conversion_timestamp,
              'condition_original',r.condition_original,
              'condition_normalized',r.condition_normalized,
              'image_url',CASE WHEN btrim(COALESCE(r.image_url,''))
                ~* '^https://thecollective-prod\.nyc3\.digitaloceanspaces\.com/listings/full/[^[:space:]]+$'
                THEN regexp_replace(btrim(r.image_url),'\?.*$','') END,
              'image_url_sha256',CASE WHEN NULLIF(btrim(r.image_url),'') IS NOT NULL
                THEN encode(extensions.digest(convert_to(btrim(r.image_url),'UTF8'),'sha256'),'hex') END,
              'source_media_key_sha256',CASE WHEN NULLIF(btrim(r.source_media_key),'') IS NOT NULL
                THEN encode(extensions.digest(convert_to(btrim(r.source_media_key),'UTF8'),'sha256'),'hex') END,
              'source_media_url_candidate',CASE WHEN btrim(COALESCE(r.source_media_url_candidate,''))
                ~* '^https://thecollective-prod\.nyc3\.digitaloceanspaces\.com/listings/full/[^[:space:]]+$'
                THEN regexp_replace(btrim(r.source_media_url_candidate),'\?.*$','') END,
              'source_media_url_candidate_sha256',CASE
                WHEN NULLIF(btrim(r.source_media_url_candidate),'') IS NOT NULL
                THEN encode(extensions.digest(convert_to(btrim(r.source_media_url_candidate),'UTF8'),'sha256'),'hex') END,
              'public_image_eligible',r.public_image_eligible,
              'publication_review_status',r.publication_review_status,
              'seller_name',COALESCE(NULLIF(btrim(r.user_name),''),NULLIF(btrim(r.from_name),'')),
              'location',r.location,
              'listing_type',upper(COALESCE(r.listing_type,r.intent,'')),
              'trading_floor_status',r.trading_floor_status,
              'verdict',r.verdict,
              'release_row',CASE WHEN r.expected_brand='Vacheron Constantin' THEN (
                SELECT v.row_data - ARRAY['raw_message','user_image_url']::text[]
                FROM public.qnsa_vacheron_overseas_reference_rows(r.expected_reference,101,0,NULL) v
                WHERE v.row_data->>'id'=r.id::text LIMIT 1
              ) ELSE (public.qnsa_four_brand_effective_detail(r.id)->'row_data')
                - ARRAY['raw_message','user_image_url']::text[] END
            ) row_data FROM rows r
          )
          SELECT jsonb_build_object(
            'contract','watchfacts-five-watch-database-snapshot-v1',
            'read_only',true,
            'project_ref','qnsafosakvonzgfcsphh',
            'row_count',count(*),
            'missing_rows',count(*) FILTER (WHERE NOT COALESCE((row_data->>'found')::boolean,false)),
            'rows',jsonb_agg(row_data ORDER BY ordinal),
            'generated_at',now()
          ) report FROM shaped;
          '@
          if ($sql -match '(?im)^\s*(INSERT|UPDATE|DELETE|TRUNCATE|ALTER|DROP|CREATE|GRANT|REVOKE)\b') {
            throw 'Exact five-watch SQL is not read-only.'
          }
          $body = @{ query = $sql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post `
            -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" `
            -Headers $headers -ContentType 'application/json' -Body $body
          if (@($result).Count -ne 1 -or -not $result[0].report) {
            throw 'Exact five-watch database snapshot did not return one report.'
          }
          $report = $result[0].report
          if ([long]$report.row_count -ne 5 -or [long]$report.missing_rows -ne 0) {
            throw 'Exact five-watch database snapshot did not reconcile all five frozen IDs.'
          }
          foreach ($row in @($report.rows)) {
            $expectedReference = ([string]$row.expected_reference).ToUpperInvariant() -replace '[^A-Z0-9]',''
            $actualReference = ([string]$row.reference_normalized).ToUpperInvariant() -replace '[^A-Z0-9]',''
            if ($row.found -ne $true -or $row.source_record_matches -ne $true -or
                $row.raw_version_source_record_matches -ne $true -or
                $row.raw_version_source_hash_matches -ne $true -or
                $row.raw_message_exact_match -ne $true -or
                $row.brand_normalized -cne $row.expected_brand -or
                $actualReference -cne $expectedReference -or -not $row.release_row) {
              throw "Exact lineage/release mismatch for frozen ID $($row.expected_id)."
            }
          }
          $report | ConvertTo-Json -Depth 20 | Set-Content `
            -LiteralPath 'audit-output/five-watch-production/database.json' -Encoding utf8NoBOM

      - name: Upload exact five-watch evidence only
        if: always() && inputs.exact_five == true
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-five-watch-production-${{ github.run_id }}
          path: audit-output/five-watch-production/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact source/public evidence completeness
        if: always() && inputs.exact_five == true
        shell: pwsh
        env:
          SOURCE_PUBLIC_OUTCOME: ${{ steps.exact_source_public.outcome }}
        run: |
          if ($env:SOURCE_PUBLIC_OUTCOME -cne 'success') {
            throw 'Exact five-watch source/public evidence was incomplete.'
          }

      - name: Run count-only production census
        if: inputs.exact_five != true
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) {
            throw 'SUPABASE_ACCESS_TOKEN is unavailable.'
          }
          New-Item -ItemType Directory -Force -Path 'audit-output/vacheron-overseas-census' | Out-Null
          $catalog = Get-Content -Raw -LiteralPath 'public/catalog-source-v1.json' | ConvertFrom-Json
          $overseasReferenceKeys = @($catalog.entries |
            Where-Object { $_.brand -ceq 'Vacheron Constantin' -and $_.model -ceq 'Overseas' } |
            ForEach-Object { [string]$_.normalized_reference } |
            Where-Object { $_ -cmatch '^[A-Z0-9]{3,50}$' } |
            Sort-Object -Unique)
          if ($overseasReferenceKeys.Count -lt 100) {
            throw 'The checked-in Overseas catalog reference set is unexpectedly incomplete.'
          }
          $catalogArraySql = ($overseasReferenceKeys | ForEach-Object { "'$_'" }) -join ','
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = @'
          SET statement_timeout = '60s';
          SET lock_timeout = '5s';
          WITH control AS MATERIALIZED (
            SELECT enabled_run_key
            FROM public.qnsa_market_feed_control
            WHERE singleton = true AND enabled = true
          ), source AS MATERIALIZED (
            SELECT l.*
            FROM control c
            JOIN staging.listings l ON l.normalization_run_key = c.enabled_run_key
            WHERE upper(COALESCE(l.category, '')) = 'WATCH'
              AND l.brand_normalized = 'Vacheron Constantin'
              AND l.parent_id IS NULL
              AND COALESCE(l.is_bundle, false) = false
              AND COALESCE(l.provenance_metadata->>'bundle_status', 'SINGLE_CANDIDATE') = 'SINGLE_CANDIDATE'
              AND l.raw_message_version_id IS NOT NULL
              AND COALESCE(l.source_record_id, '') <> ''
              AND lower(COALESCE(l.trading_floor_status, '')) NOT IN (
                'bundle_child_pending_review','bundle_pending_separation','suppressed_exact_duplicate',
                'withdrawn','rejected','hidden','deleted','archived')
              AND upper(COALESCE(l.verdict, '')) NOT IN ('WITHDRAWN','REJECTED','HIDDEN','DELETED','ARCHIVED')
          ), marked AS MATERIALIZED (
            SELECT s.*,
              lower(btrim(COALESCE(s.model_normalized, ''))) = 'overseas' AS normalized_model_exact,
              lower(btrim(COALESCE(s.model_original, ''))) = 'overseas' AS original_model_exact,
              COALESCE(s.raw_message_text, '') ~* '(^|[^[:alnum:]])overseas([^[:alnum:]]|$)' AS raw_overseas_mention,
              regexp_replace(upper(COALESCE(s.reference_normalized, '')), '[^A-Z0-9]', '', 'g')
                = ANY(ARRAY[__OVERSEAS_KEYS__]::text[]) AS catalog_overseas_reference,
              upper(COALESCE(s.listing_type, s.intent, '')) AS source_intent,
              COALESCE(s.price_usd, s.price_normalized, 0) > 0 AS has_stored_price,
              btrim(COALESCE(s.image_url, s.source_media_url_candidate, '')) ~* '^https://[^[:space:]]+$' AS has_https_media,
              s.source_hash ~ '^[0-9a-f]{64}$'
                AND s.source_candidate_hash ~ '^[0-9a-f]{64}$' AS valid_hash_lineage
            FROM source s
          ), cohort AS MATERIALIZED (
            SELECT * FROM marked
            WHERE normalized_model_exact OR original_model_exact OR raw_overseas_mention
              OR catalog_overseas_reference
          ), release_ranked AS MATERIALIZED (
            SELECT cohort.*,
              row_number() OVER (
                PARTITION BY
                  COALESCE(NULLIF(btrim(contact_number), ''), NULLIF(btrim(from_number), ''),
                    NULLIF(btrim(user_name), ''), NULLIF(btrim(from_name), ''),
                    'UNLINKED:' || source_record_id),
                  source_candidate_hash
                ORDER BY created_at DESC, id DESC
              ) AS seller_candidate_rank
            FROM cohort
          ), release_rows AS MATERIALIZED (
            SELECT * FROM release_ranked WHERE seller_candidate_rank = 1
          ), pr_candidates AS MATERIALIZED (
            SELECT * FROM release_rows
            WHERE source_intent = 'WTS'
              AND catalog_overseas_reference
              AND NULLIF(btrim(dial_color_normalized), '') IS NOT NULL
              AND COALESCE(price_usd, 0) > 0
              AND upper(COALESCE(currency_normalized, '')) IN ('USD','USDT')
          ), pr_stats AS MATERIALIZED (
            SELECT reference_normalized, dial_color_normalized,
              percentile_cont(0.25) WITHIN GROUP (ORDER BY price_usd) AS q1,
              percentile_cont(0.75) WITHIN GROUP (ORDER BY price_usd) AS q3,
              count(*) AS cohort_count
            FROM pr_candidates
            GROUP BY reference_normalized, dial_color_normalized
          ), pr_qualified AS MATERIALIZED (
            SELECT candidate.*
            FROM pr_candidates candidate
            JOIN pr_stats stats USING (reference_normalized, dial_color_normalized)
            WHERE stats.cohort_count < 2
              OR candidate.price_usd BETWEEN
                GREATEST(0, stats.q1 - 3.0 * (stats.q3 - stats.q1))
                AND stats.q3 + 3.0 * (stats.q3 - stats.q1)
          ), metrics AS (
            SELECT jsonb_build_object(
              'project_ref', 'qnsafosakvonzgfcsphh',
              'enabled_run_key', (SELECT enabled_run_key FROM control),
              'expected_overseas_rows', 1493,
              'vacheron_source_rows', (SELECT count(*) FROM marked),
              'normalized_model_exact_rows', (SELECT count(*) FROM marked WHERE normalized_model_exact),
              'original_model_exact_rows', (SELECT count(*) FROM marked WHERE original_model_exact),
              'raw_overseas_mention_rows', (SELECT count(*) FROM marked WHERE raw_overseas_mention),
              'catalog_overseas_reference_rows', (SELECT count(*) FROM marked WHERE catalog_overseas_reference),
              'raw_or_model_only_rows', count(*) FILTER (
                WHERE (normalized_model_exact OR original_model_exact OR raw_overseas_mention)
                  AND NOT catalog_overseas_reference),
              'catalog_reference_only_rows', count(*) FILTER (
                WHERE catalog_overseas_reference
                  AND NOT (normalized_model_exact OR original_model_exact OR raw_overseas_mention)),
              'raw_or_model_and_catalog_rows', count(*) FILTER (
                WHERE catalog_overseas_reference
                  AND (normalized_model_exact OR original_model_exact OR raw_overseas_mention)),
              'overseas_union_rows', count(*),
              'overseas_unique_listing_ids', count(DISTINCT id),
              'overseas_unique_source_records', count(DISTINCT source_record_id),
              'overseas_unique_source_hashes', count(DISTINCT source_hash),
              'overseas_unique_candidate_hashes', count(DISTINCT source_candidate_hash),
              'overseas_unique_source_candidate_pairs', count(DISTINCT (source_hash, source_candidate_hash)),
              'overseas_unique_seller_candidate_pairs', count(DISTINCT (
                COALESCE(NULLIF(btrim(contact_number), ''), NULLIF(btrim(from_number), ''),
                  NULLIF(btrim(user_name), ''), NULLIF(btrim(from_name), ''),
                  'UNLINKED:' || source_record_id),
                source_candidate_hash)),
              'exact_source_candidate_repost_rows', count(*)
                - count(DISTINCT (source_hash, source_candidate_hash)),
              'seller_candidate_repost_rows', count(*)
                - count(DISTINCT (
                    COALESCE(NULLIF(btrim(contact_number), ''), NULLIF(btrim(from_number), ''),
                      NULLIF(btrim(user_name), ''), NULLIF(btrim(from_name), ''),
                      'UNLINKED:' || source_record_id),
                    source_candidate_hash))
            ) || jsonb_build_object(
              'release_unique_individual_listings', (SELECT count(*) FROM release_rows),
              'release_duplicates_excluded', count(*) - (SELECT count(*) FROM release_rows),
              'release_wts_rows', (SELECT count(*) FROM release_rows WHERE source_intent = 'WTS'),
              'release_wtb_rows', (SELECT count(*) FROM release_rows WHERE source_intent = 'WTB'),
              'release_other_rows', (SELECT count(*) FROM release_rows WHERE source_intent NOT IN ('WTS','WTB')),
              'release_priced_wts_rows', (SELECT count(*) FROM release_rows WHERE source_intent = 'WTS' AND has_stored_price),
              'release_unpriced_wts_rows', (SELECT count(*) FROM release_rows WHERE source_intent = 'WTS' AND NOT has_stored_price),
              'release_explicit_usd_usdt_wts_rows', (SELECT count(*) FROM release_rows
                WHERE source_intent = 'WTS' AND COALESCE(price_usd, 0) > 0
                  AND upper(COALESCE(currency_normalized, '')) IN ('USD','USDT')),
              'release_dated_fx_wts_rows', (SELECT count(*) FROM release_rows
                WHERE source_intent = 'WTS' AND COALESCE(price_usd, 0) > 0
                  AND COALESCE(conversion_rate, 0) > 0 AND conversion_timestamp IS NOT NULL),
              'release_currency_unconfirmed_wts_rows', (SELECT count(*) FROM release_rows
                WHERE source_intent = 'WTS' AND COALESCE(price_normalized, 0) > 0
                  AND upper(COALESCE(currency_normalized, '')) NOT IN ('USD','USDT')
                  AND NOT (COALESCE(conversion_rate, 0) > 0 AND conversion_timestamp IS NOT NULL)),
              'release_owner_assumed_usd_candidates', (SELECT count(*) FROM release_rows
                WHERE source_intent = 'WTS' AND COALESCE(price_normalized, 0) > 0
                  AND NULLIF(btrim(currency_normalized), '') IS NULL),
              'release_named_currency_requires_dated_fx', (SELECT count(*) FROM release_rows
                WHERE source_intent = 'WTS' AND COALESCE(price_normalized, 0) > 0
                  AND NULLIF(btrim(currency_normalized), '') IS NOT NULL
                  AND upper(currency_normalized) NOT IN ('USD','USDT')
                  AND NOT (COALESCE(conversion_rate, 0) > 0 AND conversion_timestamp IS NOT NULL)),
              'release_pr_independently_qualified', (SELECT count(*) FROM pr_qualified),
              'release_pr_excluded_from_averages', (SELECT count(*) FROM release_rows
                WHERE source_intent = 'WTS' AND has_stored_price) - (SELECT count(*) FROM pr_qualified),
              'source_overseas_bundle_or_parent_rows', (SELECT count(*)
                FROM control c JOIN staging.listings l ON l.normalization_run_key = c.enabled_run_key
                WHERE l.brand_normalized = 'Vacheron Constantin'
                  AND COALESCE(l.raw_message_text, '') ~* '(^|[^[:alnum:]])overseas([^[:alnum:]]|$)'
                  AND (l.parent_id IS NOT NULL OR COALESCE(l.is_bundle, false)
                    OR COALESCE(l.provenance_metadata->>'bundle_status', 'SINGLE_CANDIDATE') <> 'SINGLE_CANDIDATE')),
              'release_exact_image_rows', (SELECT count(*) FROM release_rows
                WHERE public_image_eligible = true
                  AND NULLIF(btrim(source_media_key), '') IS NOT NULL
                  AND btrim(COALESCE(source_media_url_candidate, image_url, '')) ~* '^https://[^[:space:]]+$'),
              'release_text_only_rows', (SELECT count(*) FROM release_rows
                WHERE NOT (public_image_eligible = true
                  AND NULLIF(btrim(source_media_key), '') IS NOT NULL
                  AND btrim(COALESCE(source_media_url_candidate, image_url, '')) ~* '^https://[^[:space:]]+$')),
              'release_exact_dealer_linked_rows', (SELECT count(*) FROM release_rows r
                JOIN public.dealer_listing_links dl ON dl.listing_id = r.id AND dl.link_status = 'APPLIED'),
              'release_unlinked_dealer_rows', (SELECT count(*) FROM release_rows r
                LEFT JOIN public.dealer_listing_links dl ON dl.listing_id = r.id AND dl.link_status = 'APPLIED'
                WHERE dl.listing_id IS NULL),
              'release_listing_ids_sha256', (SELECT encode(extensions.digest(convert_to(
                string_agg(id::text, E'\n' ORDER BY id), 'UTF8'), 'sha256'), 'hex') FROM release_rows),
              'explicit_wts_rows', count(*) FILTER (WHERE source_intent = 'WTS'),
              'explicit_wtb_rows', count(*) FILTER (WHERE source_intent = 'WTB'),
              'missing_or_other_intent_rows', count(*) FILTER (WHERE source_intent NOT IN ('WTS','WTB')),
              'priced_rows', count(*) FILTER (WHERE has_stored_price),
              'priced_wts_rows', count(*) FILTER (WHERE source_intent = 'WTS' AND has_stored_price),
              'unpriced_rows', count(*) FILTER (WHERE NOT has_stored_price),
              'explicit_usd_usdt_wts_rows', count(*) FILTER (
                WHERE source_intent = 'WTS' AND COALESCE(price_usd, 0) > 0
                  AND upper(COALESCE(currency_normalized, '')) IN ('USD','USDT')),
              'dated_fx_wts_rows', count(*) FILTER (
                WHERE source_intent = 'WTS' AND COALESCE(price_usd, 0) > 0
                  AND COALESCE(conversion_rate, 0) > 0 AND conversion_timestamp IS NOT NULL),
              'stored_price_currency_unconfirmed_wts_rows', count(*) FILTER (
                WHERE source_intent = 'WTS' AND COALESCE(price_normalized, 0) > 0
                  AND upper(COALESCE(currency_normalized, '')) NOT IN ('USD','USDT')
                  AND NOT (COALESCE(conversion_rate, 0) > 0 AND conversion_timestamp IS NOT NULL)),
              'https_media_claim_rows', count(*) FILTER (WHERE has_https_media),
              'valid_lineage_rows', count(*) FILTER (WHERE valid_hash_lineage),
              'missing_reference_rows', count(*) FILTER (WHERE NULLIF(btrim(reference_normalized), '') IS NULL),
              'missing_model_rows', count(*) FILTER (WHERE NULLIF(btrim(model_normalized), '') IS NULL),
              'missing_dial_rows', count(*) FILTER (WHERE NULLIF(btrim(dial_color_normalized), '') IS NULL),
              'missing_condition_rows', count(*) FILTER (WHERE NULLIF(btrim(condition_normalized), '') IS NULL),
              'listing_ids_sha256', encode(extensions.digest(convert_to(string_agg(id::text, E'\n' ORDER BY id), 'UTF8'), 'sha256'), 'hex'),
              'source_candidate_hashes_sha256', encode(extensions.digest(convert_to(string_agg(source_candidate_hash, E'\n' ORDER BY source_candidate_hash), 'UTF8'), 'sha256'), 'hex'),
              'generated_at', now()
            ) AS evidence
            FROM cohort
          ), reference_counts AS (
            SELECT COALESCE(NULLIF(btrim(reference_normalized), ''), 'UNRESOLVED') AS reference,
              count(*)::bigint AS row_count
            FROM cohort
            GROUP BY 1
            ORDER BY row_count DESC, reference
            LIMIT 100
          ), model_counts AS (
            SELECT COALESCE(NULLIF(btrim(model_normalized), ''), 'UNRESOLVED') AS model,
              count(*)::bigint AS row_count
            FROM cohort
            GROUP BY 1
            ORDER BY row_count DESC, model
            LIMIT 50
          )
          SELECT jsonb_build_object(
            'evidence', (SELECT evidence FROM metrics),
            'top_references', COALESCE((SELECT jsonb_agg(to_jsonb(reference_counts)) FROM reference_counts), '[]'::jsonb),
            'models', COALESCE((SELECT jsonb_agg(to_jsonb(model_counts)) FROM model_counts), '[]'::jsonb)
          ) AS report;
          '@
          $sql = $sql.Replace('__OVERSEAS_KEYS__', $catalogArraySql)
          if ($sql.Contains('__OVERSEAS_KEYS__')) { throw 'Catalog reference placeholder was not replaced.' }
          if ($sql -match '(?im)^\s*(INSERT|UPDATE|DELETE|TRUNCATE|ALTER|DROP|CREATE|GRANT|REVOKE)\b') {
            throw 'Census SQL is not read-only.'
          }
          $body = @{ query = [string]$sql; read_only = $true } | ConvertTo-Json -Depth 3
          $rows = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          if (@($rows).Count -ne 1 -or -not $rows[0].report) {
            throw 'Census did not return one aggregate report.'
          }
          $report = $rows[0].report
          if ($report.evidence.project_ref -cne 'qnsafosakvonzgfcsphh') { throw 'Wrong project evidence.' }
          if ([long]$report.evidence.vacheron_source_rows -lt 1) { throw 'No Vacheron source rows found.' }
          if ([long]$report.evidence.overseas_unique_listing_ids -ne [long]$report.evidence.overseas_union_rows) {
            throw 'Overseas cohort contains duplicate listing IDs.'
          }
          $report | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath 'audit-output/vacheron-overseas-census/report.json' -Encoding utf8NoBOM
          Write-Output "vacheron_source_rows=$($report.evidence.vacheron_source_rows)"
          Write-Output "overseas_union_rows=$($report.evidence.overseas_union_rows)"
          Write-Output "listing_ids_sha256=$($report.evidence.listing_ids_sha256)"

      - name: Upload aggregate evidence only
        if: inputs.exact_five != true
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-vacheron-overseas-census-${{ github.run_id }}
          path: audit-output/vacheron-overseas-census/report.json
          if-no-files-found: error
          retention-days: 14

