name: Inspect Supabase production migration ledger

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSPECT_PRODUCTION_MIGRATION_LEDGER to continue
        required: true
        type: string

concurrency:
  group: supabase-migration-ledger-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Link production project locally
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          
      - name: Export Supabase Status
        shell: bash
        run: |
          set -euo pipefail
          # Fetch status as JSON (or parse it) to get keys
          ANON_KEY=$(supabase status -o json | jq -r '.anon_key')
          if [ "$ANON_KEY" = "null" ] || [ -z "$ANON_KEY" ]; then
             # Try falling back if the CLI doesn't support json output for status of linked projects
             # For linked projects, we might need to get it via API or it might be in .env
             # Actually, supabase status for a remote project doesn't output anon key. 
             # We can get it via `supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json`
             ANON_KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[] | select(.name == "anon") | .api_key')
          fi
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          
          HOST="aws-1-us-west-2.pooler.supabase.com"
          USER="postgres.${SUPABASE_PROJECT_REF}"
          PORT="5432"
          echo "DATABASE_URL=postgresql://${USER}:${PGPASSWORD}@${HOST}:${PORT}/postgres" >> "$GITHUB_ENV"
          
      - name: Install dependencies
        run: pip install psycopg2-binary pymysql
        
      - name: Run Python Integration Tests
        run: |
          python -m unittest discover tests
