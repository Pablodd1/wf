name: QNSA Tudor read-only release census

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT_QNSA_TUDOR_RELEASE
        required: true
        type: string

concurrency:
  group: qnsa-tudor-release-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_REF: qnsafosakvonzgfcsphh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact authorization
        shell: pwsh
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_CONFIRMATION -cne 'AUDIT_QNSA_TUDOR_RELEASE') { throw 'Invalid confirmation.' }
          if ($env:SUPABASE_PROJECT_REF -cne 'qnsafosakvonzgfcsphh') { throw 'Workflow is not QNSA pinned.' }
      - name: Run read-only aggregate census
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          New-Item -ItemType Directory -Force -Path 'audit-output/tudor-release-census' | Out-Null
          node tools/audit/qnsa-tudor-release-census.cjs --output 'audit-output/tudor-release-census/report.json'
      - name: Upload aggregate evidence only
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-tudor-release-census-${{ github.run_id }}
          path: audit-output/tudor-release-census/report.json
          if-no-files-found: error
          retention-days: 14
