name: QNSA Rolex Patek delta schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_QNSA_ROLEX_PATEK_DELTA_SCHEMA
        required: true
        type: string

concurrency:
  group: qnsa-rolex-patek-delta-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact confirmation
        shell: bash
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          HAS_MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          test "$INPUT_CONFIRMATION" = APPLY_QNSA_ROLEX_PATEK_DELTA_SCHEMA
          test "$HAS_MGMT" = true
      - name: Compile and atomically apply QNSA-only forward schema
        env:
          RELEASE_MODE: schema
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          QNSA_ENV_FILE: ${{ runner.temp }}/qnsa.env
        run: node tools/intake/prepare-qnsa-rolex-patek-delta.cjs
      - name: Remove ephemeral service environment
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/qnsa.env"
