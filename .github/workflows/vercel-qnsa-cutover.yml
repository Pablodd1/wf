name: Vercel QNSA production cutover

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CUTOVER_VERCEL_TO_QNSA
        required: true
        type: string

concurrency:
  group: vercel-qnsa-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ inputs.confirmation == 'CUTOVER_VERCEL_TO_QNSA' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_PROJECT_REF: qnsafosakvonzgfcsphh
      VERCEL_SCOPE: pablos-projects-0f79dff2
      PRODUCTION_URL: https://watchfacts-poc.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target and release controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.confirmation }}' -cne 'CUTOVER_VERCEL_TO_QNSA') {
            throw 'Exact production cutover confirmation is required.'
          }
          if (-not $env:SUPABASE_ACCESS_TOKEN -or -not $env:VERCEL_TOKEN) {
            throw 'Required deployment credentials are unavailable.'
          }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = @"
          SELECT jsonb_build_object(
            'checkpoint', (
              SELECT to_jsonb(c)
              FROM staging.mariadb_normalization_import_checkpoints c
              WHERE run_key = 'mariadb-normalized-20260811-codex-v1'
            ),
            'controls', (
              SELECT jsonb_agg(to_jsonb(control) ORDER BY canonical_brand)
              FROM public.qnsa_two_brand_release_control control
              WHERE canonical_brand IN ('Rolex', 'Patek Philippe')
            )
          ) AS evidence;
          "@
          $body = @{ query = [string]$sql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          $evidence = $result[0].evidence
          $controls = @($evidence.controls)
          if ($evidence.checkpoint.status -ne 'NORMALIZATION_STAGED' -or
              [long]$evidence.checkpoint.input_rows -ne 1394269 -or
              [long]$evidence.checkpoint.error_rows -ne 0 -or
              $controls.Count -ne 2 -or
              @($controls | Where-Object {
                $_.trading_floor_enabled -ne $true -or $_.price_research_enabled -ne $true
              }).Count -ne 0) {
            $evidence | ConvertTo-Json -Depth 6
            throw 'QNSA reviewed release is not ready for application cutover.'
          }

      - name: Retrieve QNSA API keys without logging them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $keys = Invoke-RestMethod -Uri "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/api-keys?reveal=true" -Headers $headers
          $server = $keys | Where-Object { $_.api_key -and ($_.name -eq 'service_role' -or $_.type -eq 'secret') } | Select-Object -First 1
          $public = $keys | Where-Object { $_.api_key -and ($_.name -eq 'anon' -or $_.type -eq 'publishable') } | Select-Object -First 1
          if (-not $server -or -not $public) { throw 'QNSA API keys were not available.' }
          Write-Output "::add-mask::$($server.api_key)"
          Write-Output "::add-mask::$($public.api_key)"
          "QNSA_SERVICE_KEY=$($server.api_key)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "QNSA_PUBLIC_KEY=$($public.api_key)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "QNSA_URL=https://$env:SUPABASE_PROJECT_REF.supabase.co" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Vercel CLI and snapshot rollback values
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global vercel@50.17.1
          vercel env pull .env.vercel.rollback --environment=production --yes --token=$env:VERCEL_TOKEN --scope=$env:VERCEL_SCOPE
          if (-not (Test-Path -LiteralPath .env.vercel.rollback)) { throw 'Vercel rollback snapshot was not created.' }

      - name: Update production environment and deploy with rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-DotEnv([string]$name) {
            $line = Get-Content -LiteralPath .env.vercel.rollback | Where-Object { $_ -match "^$([regex]::Escape($name))=" } | Select-Object -First 1
            if (-not $line) { return $null }
            $value = $line.Substring($line.IndexOf('=') + 1).Trim()
            if ($value.StartsWith('"') -and $value.EndsWith('"')) {
              $value = $value.Substring(1, $value.Length - 2)
            }
            return $value.Replace('\n', "`n").Replace('\"', '"').Replace('\\', '\')
          }
          function Set-VercelEnv([string]$name, [string]$value) {
            if ($null -eq $value) { throw "Cannot set empty Vercel value for $name." }
            $value | vercel env add $name production --force --yes --sensitive --token=$env:VERCEL_TOKEN --scope=$env:VERCEL_SCOPE | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to set Vercel environment variable $name." }
          }
          $names = @(
            'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY',
            'VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY',
            'PUBLICATION_BRANDS', 'PUBLICATION_REFERENCES',
            'TRADING_FLOOR_SOURCE_VIEW', 'PRICE_RESEARCH_SOURCE_VIEW'
          )
          $old = @{}
          foreach ($name in $names) { $old[$name] = Read-DotEnv $name }
          $rollbackReady = $old['SUPABASE_URL'] -match '^https://[a-z0-9]+\.supabase\.co$' `
            -and -not [string]::IsNullOrWhiteSpace($old['SUPABASE_SERVICE_ROLE_KEY'])

          try {
            Set-VercelEnv 'SUPABASE_URL' $env:QNSA_URL
            Set-VercelEnv 'SUPABASE_SERVICE_ROLE_KEY' $env:QNSA_SERVICE_KEY
            Set-VercelEnv 'VITE_SUPABASE_URL' $env:QNSA_URL
            Set-VercelEnv 'VITE_SUPABASE_ANON_KEY' $env:QNSA_PUBLIC_KEY
            Set-VercelEnv 'PUBLICATION_BRANDS' 'Rolex|Patek Philippe'
            Set-VercelEnv 'PUBLICATION_REFERENCES' 'ALL_REVIEWED'
            Set-VercelEnv 'TRADING_FLOOR_SOURCE_VIEW' 'qnsa_rolex_patek_trading_floor_source'
            Set-VercelEnv 'PRICE_RESEARCH_SOURCE_VIEW' 'qnsa_rolex_patek_price_research_source'
            vercel deploy --prod --yes --token=$env:VERCEL_TOKEN --scope=$env:VERCEL_SCOPE | Tee-Object -FilePath vercel-production-deployment.txt
            if ($LASTEXITCODE -ne 0) { throw 'Vercel production deployment failed.' }

            $healthy = $false
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              Start-Sleep -Seconds 5
              try {
                $health = Invoke-RestMethod -Uri "$env:PRODUCTION_URL/api/health" -TimeoutSec 20
                if ($health.database_project_ref -eq $env:SUPABASE_PROJECT_REF) {
                  $healthy = $true
                  break
                }
              } catch { Write-Output "Health attempt $attempt is not ready." }
            }
            if (-not $healthy) { throw 'Production health did not confirm the QNSA project.' }

            $rolex = Invoke-RestMethod -Uri "$env:PRODUCTION_URL/api/reviewed-market-inventory?brand=Rolex&reference=116500LN&limit=5" -TimeoutSec 45
            $patek = Invoke-RestMethod -Uri "$env:PRODUCTION_URL/api/price-research?brand=Patek%20Philippe&reference=5712" -TimeoutSec 45
            if (@($rolex.records).Count -eq 0) {
              throw 'Production Rolex Trading Floor smoke test returned no rows.'
            }
            if (@($patek.rows).Count -eq 0) {
              throw 'Production Patek 5712 Price Research smoke test returned no rows.'
            }
            [pscustomobject]@{
              project_ref = $env:SUPABASE_PROJECT_REF
              rolex_trading_verified = $true
              patek_5712_price_verified = $true
            } | ConvertTo-Json | Out-File qnsa-cutover-evidence.json -Encoding utf8
          } catch {
            if ($rollbackReady) {
              Write-Warning "Cutover failed; restoring the validated previous production environment. $($_.Exception.Message)"
              foreach ($name in $names) {
                if ($null -ne $old[$name]) { Set-VercelEnv $name $old[$name] }
              }
              vercel deploy --prod --yes --token=$env:VERCEL_TOKEN --scope=$env:VERCEL_SCOPE | Out-Null
            } else {
              Write-Warning "Cutover failed and the prior environment snapshot is invalid; retaining the complete QNSA environment instead of restoring blank credentials. $($_.Exception.Message)"
            }
            throw
          } finally {
            Remove-Item -LiteralPath .env.vercel.rollback -Force -ErrorAction SilentlyContinue
          }

      - name: Upload non-secret cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-production-cutover-${{ github.run_id }}
          path: |
            qnsa-cutover-evidence.json
            vercel-production-deployment.txt
          if-no-files-found: warn
          retention-days: 30
