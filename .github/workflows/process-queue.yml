name: Process Queue — Incremental (every 5 min)

# Runs every 5 minutes and processes the reprocess_queue
# Picks up: new chat messages, human edits, AI corrections
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:   # also allow manual trigger

jobs:
  process-queue:
    name: Process reprocess_queue
    runs-on: ubuntu-latest
    timeout-minutes: 8   # 5min interval + buffer

    steps:
      - name: Call batch-process endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://watchfacts-poc.vercel.app/api/batch-process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"batchSize": 150}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          # Parse results for logging
          PROCESSED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('processed',0))" 2>/dev/null || echo "?")
          ERRORS=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('errors',0))" 2>/dev/null || echo "?")
          ELAPSED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('elapsed_ms',0))" 2>/dev/null || echo "?")

          echo "Processed: $PROCESSED | Errors: $ERRORS | Elapsed: ${ELAPSED}ms"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: batch-process returned $HTTP_CODE — check Vercel logs"
            # Don't fail the job on non-200, just warn (queue will retry next cycle)
          fi
