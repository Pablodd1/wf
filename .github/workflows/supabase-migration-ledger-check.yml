name: Inspect Supabase production migration ledger

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSPECT_PRODUCTION_MIGRATION_LEDGER to continue
        required: true
        type: string

concurrency:
  group: supabase-migration-ledger-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Fetch Supabase ANON_KEY via API
        shell: bash
        run: |
          set -euo pipefail
          KEYS_JSON=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys")
          ANON_KEY=$(echo "$KEYS_JSON" | jq -r '.[] | select(.name == "anon" or .name == "anon_key") | .api_key')
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
             echo "Failed to extract ANON_KEY. Response was:"
             echo "$KEYS_JSON"
             exit 1
          fi
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          
      - name: Resolve IPv4 pooler target and Database URL
        shell: bash
        run: |
          set -euo pipefail
          HOST="aws-1-us-west-2.pooler.supabase.com"
          USER="postgres.${SUPABASE_PROJECT_REF}"
          PORT="5432"
          echo "DATABASE_URL=postgresql://${USER}:${PGPASSWORD}@${HOST}:${PORT}/postgres" >> "$GITHUB_ENV"
          
      - name: Install dependencies
        run: pip install psycopg2-binary pymysql
        
      - name: Apply Supabase Migrations
        run: python scripts/apply_migrations.py
        
      - name: Run 10-Case Canary
        run: python scripts/run_10_case_canary.py
        
      - name: Run Python Integration Tests
        run: |
          python -m unittest discover tests
