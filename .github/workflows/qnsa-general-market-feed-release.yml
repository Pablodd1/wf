name: QNSA general market feed release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE_QNSA_GENERAL_MARKET_FEED
        required: true
        type: string

concurrency:
  group: qnsa-general-market-feed-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirmation == 'RELEASE_QNSA_GENERAL_MARKET_FEED' }}
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qnsafosakvonzgfcsphh
      EXPECTED_RUN_KEY: mariadb-normalized-20260811-codex-v1
    steps:
      - uses: actions/checkout@v4

      - name: Compile in rollback transaction and audit source lane
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $migration = Get-Content -Raw 'supabase/migrations/20260812110000_qnsa_general_market_feed.sql'
          $compile = "BEGIN;`n$migration`nROLLBACK;"
          $body = @{ query = $compile; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

          $auditSql = @"
          SELECT jsonb_build_object(
            'database_gib', round(pg_database_size(current_database())::numeric / 1073741824, 3),
            'run_rows', count(*),
            'invalid_lineage', count(*) FILTER (WHERE raw_message_version_id IS NULL OR source_record_id IS NULL),
            'bundle_or_child_rows', count(*) FILTER (WHERE parent_id IS NOT NULL OR COALESCE(is_bundle,false)),
            'watch_rows', count(*) FILTER (WHERE upper(category)='WATCH'),
            'handbag_rows', count(*) FILTER (WHERE upper(category)='HANDBAG'),
            'jewelry_rows', count(*) FILTER (WHERE upper(category)='JEWELRY'),
            'accessory_rows', count(*) FILTER (WHERE upper(category)='ACCESSORY')
          ) AS audit
          FROM staging.listings
          WHERE normalization_run_key = '$env:EXPECTED_RUN_KEY';
          "@
          $body = @{ query = $auditSql; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          $audit = $result[0].audit
          $audit | ConvertTo-Json -Depth 4
          if ([long]$audit.run_rows -ne 603678 -or [long]$audit.invalid_lineage -ne 0 -or [long]$audit.bundle_or_child_rows -ne 0) {
            throw 'Reconciled staging boundary changed; refusing release.'
          }

      - name: Apply forward market feed contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $migration = Get-Content -Raw 'supabase/migrations/20260812110000_qnsa_general_market_feed.sql'
          $body = @{ query = $migration; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          Start-Sleep -Seconds 3

      - name: Reconcile counts and bounded customer pages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = @"
          SELECT jsonb_build_object(
            'counts', (SELECT jsonb_agg(to_jsonb(c)) FROM public.qnsa_market_feed_counts() c),
            'all_page', (SELECT count(*) FROM public.qnsa_market_feed_page_rows(NULL,NULL,51,0,NULL,false,NULL,NULL)),
            'rolex_page', (SELECT count(*) FROM public.qnsa_market_feed_page_rows('Rolex','WATCH',51,0,NULL,false,NULL,NULL)),
            'patek_page', (SELECT count(*) FROM public.qnsa_market_feed_page_rows('Patek Philippe','WATCH',51,0,NULL,false,NULL,NULL)),
            'handbag_page', (SELECT count(*) FROM public.qnsa_market_feed_page_rows(NULL,'HANDBAG',51,0,NULL,false,NULL,NULL)),
            'jewelry_page', (SELECT count(*) FROM public.qnsa_market_feed_page_rows(NULL,'JEWELRY',51,0,NULL,false,NULL,NULL)),
            'accessory_page', (SELECT count(*) FROM public.qnsa_market_feed_page_rows(NULL,'ACCESSORY',51,0,NULL,false,NULL,NULL)),
            'media_leakage', (SELECT count(*) FROM public.qnsa_market_feed_page_rows(NULL,NULL,101,0,NULL,false,NULL,NULL) r WHERE r.row_data->>'parent_id' IS NOT NULL)
          ) AS evidence;
          "@
          $body = @{ query = $sql; read_only = $true } | ConvertTo-Json -Depth 4
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          $evidence = $result[0].evidence
          $evidence | ConvertTo-Json -Depth 8
          if ([long]$evidence.all_page -lt 50 -or [long]$evidence.rolex_page -lt 50 -or [long]$evidence.patek_page -lt 50 -or
              [long]$evidence.handbag_page -lt 1 -or [long]$evidence.jewelry_page -lt 1 -or [long]$evidence.accessory_page -lt 1 -or
              [long]$evidence.media_leakage -ne 0) {
            throw 'General market feed release reconciliation failed.'
          }
