name: QNSA global image and price ordering

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_QNSA_GLOBAL_IMAGE_PRICE_ORDERING
        required: true
        type: string

concurrency:
  group: qnsa-global-image-price-ordering
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ inputs.confirmation == 'APPLY_QNSA_GLOBAL_IMAGE_PRICE_ORDERING' }}
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qnsafosakvonzgfcsphh
      EXPECTED_RUN_KEY: mariadb-normalized-20260811-codex-v1
      MIGRATION_FILE: supabase/migrations/20260813090000_qnsa_global_image_price_ordering.sql
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact target and compile in rollback transaction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          if ($env:PROJECT_REF -ne 'qnsafosakvonzgfcsphh') { throw 'Workflow is not pinned to QNSA.' }
          if (-not (Test-Path -LiteralPath $env:MIGRATION_FILE)) { throw 'Exact migration file is missing.' }
          $sql = [string](Get-Content -Raw -LiteralPath $env:MIGRATION_FILE)
          if ($sql -match '(?i)(INSERT|UPDATE|DELETE|TRUNCATE)\s+.*(watch_records|raw_messages|raw_message_versions|staging\.listings)') {
            throw 'Ordering migration attempts a source or listing data write.'
          }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $body = @{ query = "BEGIN;`n$sql`nROLLBACK;"; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: Audit reconciled lane and function dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $query = @"
          SELECT jsonb_build_object(
            'run_rows', count(*),
            'invalid_lineage', count(*) FILTER (WHERE raw_message_version_id IS NULL OR source_record_id IS NULL),
            'bundle_or_child_rows', count(*) FILTER (WHERE parent_id IS NOT NULL OR COALESCE(is_bundle,false)),
            'release_control', to_regclass('public.qnsa_two_brand_release_control') IS NOT NULL,
            'market_control', to_regclass('public.qnsa_market_feed_control') IS NOT NULL
          ) AS audit
          FROM staging.listings
          WHERE normalization_run_key = '$env:EXPECTED_RUN_KEY';
          "@
          $body = @{ query = $query; read_only = $true } | ConvertTo-Json -Depth 3
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          $audit = $result[0].audit
          $audit | ConvertTo-Json -Depth 5
          if ([long]$audit.run_rows -ne 603678 -or [long]$audit.invalid_lineage -ne 0 -or [long]$audit.bundle_or_child_rows -ne 0 -or
              -not [bool]$audit.release_control -or -not [bool]$audit.market_control) {
            throw 'QNSA ordering preflight failed.'
          }

      - name: Apply only the reviewed forward migration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $sql = [string](Get-Content -Raw -LiteralPath $env:MIGRATION_FILE)
          $body = @{ query = $sql; read_only = $false } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          Start-Sleep -Seconds 3

      - name: Reconcile ordered reference pages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $query = @"
          WITH samples AS (
            SELECT 'Rolex 116500LN' AS cohort, row_data
            FROM public.qnsa_trading_floor_reference_rows('Rolex','116500LN',false,51,0) row_data
            UNION ALL
            SELECT 'Patek 5712', row_data
            FROM public.qnsa_trading_floor_reference_rows('Patek Philippe','5712',true,51,0) row_data
            UNION ALL
            SELECT 'AP 26240ST', row_data
            FROM public.qnsa_trading_floor_reference_rows('Audemars Piguet','26240ST',true,51,0) row_data
          ), ranked AS (
            SELECT cohort, row_data,
              row_number() OVER (PARTITION BY cohort ORDER BY
                COALESCE((row_data->>'has_exact_source_image')::boolean,false) DESC,
                COALESCE((row_data->>'has_verified_usd_price')::boolean,false) DESC,
                (row_data->>'posting_date')::timestamptz DESC,
                row_data->>'id' DESC) AS expected_position,
              row_number() OVER (PARTITION BY cohort) AS returned_position
            FROM samples
          )
          SELECT jsonb_build_object(
            'cohorts', count(DISTINCT cohort),
            'rows', count(*),
            'ordering_violations', count(*) FILTER (WHERE expected_position <> returned_position),
            'bundle_or_child_leaks', count(*) FILTER (WHERE row_data->>'parent_id' IS NOT NULL),
            'duplicate_ids', count(*) - count(DISTINCT cohort || ':' || (row_data->>'id'))
          ) AS evidence
          FROM ranked;
          "@
          $body = @{ query = $query; read_only = $true } | ConvertTo-Json -Depth 4
          $result = Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/database/query" -Headers $headers -ContentType 'application/json' -Body $body
          $evidence = $result[0].evidence
          $evidence | ConvertTo-Json -Depth 5
          if ([long]$evidence.cohorts -ne 3 -or [long]$evidence.rows -lt 3 -or [long]$evidence.ordering_violations -ne 0 -or
              [long]$evidence.bundle_or_child_leaks -ne 0 -or [long]$evidence.duplicate_ids -ne 0) {
            throw 'Post-migration ordering reconciliation failed.'
          }

      - name: Smoke live customer endpoints
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://watchfacts-poc.vercel.app/api/reviewed-market-inventory?pageSize=12'
          $cases = @(
            "$base&brand=Rolex&reference=116500LN",
            "$base&brand=Patek%20Philippe&reference=5712",
            "$base&brand=Audemars%20Piguet&reference=26240ST"
          )
          foreach ($url in $cases) {
            $response = Invoke-RestMethod -Uri "$url&release=$env:GITHUB_SHA" -TimeoutSec 45
            if ($response.status -ne 'ok' -or [int]$response.count -lt 1) {
              throw "Live Trading Floor smoke failed: $url"
            }
          }
