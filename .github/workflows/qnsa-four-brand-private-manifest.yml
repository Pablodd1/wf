name: QNSA four-brand private enrichment manifest

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: Unique immutable audit run key
        required: true
        type: string
      source_run_id:
        description: Same-repository run containing public advisory JSON files
        required: true
        type: string
      advisory_artifact_name:
        description: Public advisory artifact name
        required: true
        type: string
      advisory_files:
        description: Comma-separated JSON filenames inside the artifact
        required: true
        type: string
      advisory_sha256_json:
        description: JSON object mapping every advisory filename to its SHA-256
        required: true
        type: string
      confirmation:
        description: BUILD_PRIVATE_MANIFEST followed by underscore and the exact run key
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: qnsa-four-brand-private-manifest-${{ inputs.run_key }}
  cancel-in-progress: false

jobs:
  build-private-manifest:
    environment: production
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: qnsafosakvonzgfcsphh
      SUPABASE_URL: https://qnsafosakvonzgfcsphh.supabase.co
      OUTPUT_FILE: private-output/manifest.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate read-only private audit authorization
        shell: pwsh
        env:
          INPUT_RUN_KEY: ${{ inputs.run_key }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROJECT_REF -cne 'qnsafosakvonzgfcsphh') { throw 'Workflow is not QNSA pinned.' }
          if ($env:INPUT_RUN_KEY -notmatch '^[A-Za-z0-9][A-Za-z0-9_.:-]{5,119}$') { throw 'Unsafe run key.' }
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$') { throw 'source_run_id must be a GitHub run ID.' }
          $expected = "BUILD_PRIVATE_MANIFEST_$($env:INPUT_RUN_KEY)"
          if ($env:INPUT_CONFIRMATION -cne $expected) { throw "Confirmation must exactly match $expected" }

      - name: Download public advisory artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.advisory_artifact_name }}
          path: public-advisory
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify every advisory file and checksum
        shell: pwsh
        env:
          ADVISORY_FILES: ${{ inputs.advisory_files }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
          ADVISORY_SHA256_JSON: ${{ inputs.advisory_sha256_json }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @($env:ADVISORY_FILES.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($files.Count -lt 1 -or $files.Count -gt 8) { throw 'Provide 1..8 advisory files.' }
          $hashes = $env:ADVISORY_SHA256_JSON | ConvertFrom-Json -AsHashtable
          if ($hashes.Count -ne $files.Count) { throw 'Checksum map must exactly cover advisory_files.' }
          foreach ($file in $files) {
            if ($file -notmatch '^[A-Za-z0-9][A-Za-z0-9_.-]*\.json$') { throw "Unsafe advisory filename: $file" }
            if (-not $hashes.ContainsKey($file) -or $hashes[$file] -notmatch '^[0-9a-f]{64}$') { throw "Missing checksum for $file" }
            $path = Join-Path 'public-advisory' $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Advisory file is absent: $file" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $hashes[$file]) { throw "Checksum mismatch for $file" }
          }

      - run: npm ci

      - name: Resolve the current QNSA service key without exposing it
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_ACCESS_TOKEN) { throw 'SUPABASE_ACCESS_TOKEN is unavailable.' }
          $headers = @{ Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN" }
          $keys = Invoke-RestMethod -Method Get `
            -Uri "https://api.supabase.com/v1/projects/$env:PROJECT_REF/api-keys" `
            -Headers $headers
          $service = @($keys | Where-Object {
            $_.api_key -and ($_.name -eq 'service_role' -or $_.type -eq 'secret')
          }) | Select-Object -First 1
          if (-not $service.api_key) { throw 'Current QNSA service key is unavailable.' }
          "::add-mask::$($service.api_key)"
          "QNSA_RUNTIME_SERVICE_ROLE_KEY=$($service.api_key)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build service-only private manifest without writes
        shell: pwsh
        env:
          ADVISORY_FILES: ${{ inputs.advisory_files }}
          INPUT_RUN_KEY: ${{ inputs.run_key }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:QNSA_RUNTIME_SERVICE_ROLE_KEY) { throw 'A current service-only QNSA key is unavailable.' }
          $env:SUPABASE_SERVICE_ROLE_KEY = $env:QNSA_RUNTIME_SERVICE_ROLE_KEY
          $arguments = @()
          foreach ($file in $env:ADVISORY_FILES.Split(',')) {
            $name = $file.Trim()
            if ($name) { $arguments += @('--advisory',(Join-Path 'public-advisory' $name)) }
          }
          $arguments += @('--output',$env:OUTPUT_FILE,'--run-key',$env:INPUT_RUN_KEY)
          node tools/mariadb-live/build-four-brand-private-enrichment-manifest.cjs @arguments

      - name: Validate private contract and produce checksums
        shell: pwsh
        env:
          INPUT_RUN_KEY: ${{ inputs.run_key }}
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.OUTPUT_FILE));if(m.contract!=='four-brand-private-enrichment-manifest-v1'||m.run_key!==process.env.INPUT_RUN_KEY||!Array.isArray(m.records)||!m.records.length)throw Error('empty or invalid private contract/run binding');if(!Array.isArray(m.canary_listing_ids)||m.canary_listing_ids.length>40)throw Error('invalid canary');for(const r of m.records){if(!r.proposal_authority||!/^[0-9a-f]{64}$/.test(r.proposal_digest)||typeof r.proposal_canonical!=='string')throw Error('invalid private proposal')}"
          $hash = (Get-FileHash -LiteralPath $env:OUTPUT_FILE -Algorithm SHA256).Hash.ToLowerInvariant()
          "manifest_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "PRIVATE_MANIFEST_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload short-lived private manifest
        uses: actions/upload-artifact@v4
        with:
          name: qnsa-four-brand-private-manifest-${{ inputs.run_key }}
          path: private-output/manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Record artifact handoff
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath $env:OUTPUT_FILE -Raw | ConvertFrom-Json
          @"
          ## Four-brand private manifest (read only)

          - Contract: ``$($manifest.contract)``
          - Run key: ``$($manifest.run_key)``
          - Accepted private records: $($manifest.records.Count)
          - Skipped advisory records: $($manifest.skipped.Count)
          - Exact canary IDs: $($manifest.canary_listing_ids.Count) (stored in the private artifact)
          - Canary plan SHA-256: ``$($manifest.canary_plan_sha256)``
          - Manifest SHA-256: ``$env:PRIVATE_MANIFEST_SHA256``
          - Database writes: 0
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
